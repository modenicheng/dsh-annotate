name: Release

# The release pipeline as a dispatcher plus thin lanes; the lane bodies live
# in .github/actions/ (build-release-artifacts, npm-publish, amo-submit,
# cws-submit, fetch-verified-asset). Three moves (docs/DISTRIBUTION.md §4.3):
#
#   build and draft    release-please merges the Release PR, tags vX.Y.Z, and
#                       opens the DRAFT release with the generated notes; its
#                       workflow then calls the draft job here through
#                       workflow_call to run the CI gate on the tag, build
#                       every artifact once, and attach them to that draft.
#                       This is the only way a tag enters the pipeline: a
#                       hand-pushed tag triggers nothing, so a version that
#                       skipped the Release PR cannot ship.
#   release published  channels ∥ verify — which stores have credentials,
#                       and that the release's artifacts are the checksummed
#                       bytes (never a rebuild, §4.9); a dry run may validate
#                       a draft
#   then, in parallel the four lanes npm ∥ AMO ∥ CWS ∥ Edge — each gated on
#                       its own credentials, each idempotent (§4.7), each red
#                       on its own failure; the summary job turns any lane
#                       failure into a red run after every lane has had a turn
#
# Invariants kept from §4.3–§4.10:
#   * two human gates: merging the Release PR decides the version and the
#     changelog; the draft's Publish click gates every registry and store;
#   * a lane without credentials skips with a notice and the run stays green;
#   * a dry run uploads nothing — every lane, npm included, is gated on it;
#   * the npm lane stays in this file with no `environment:`: the npm
#     trusted-publisher registration names release.yml (§6.1).
#
# Store credentials live in the protected `release` environment (§4.8), all
# optional:
#   AMO_JWT_ISSUER, AMO_JWT_SECRET      AMO API keys (addons.mozilla.org)
#   CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN   Google OAuth client
#   vars.CWS_PUBLISHER_ID, vars.CWS_ITEM_ID               CWS ids; item exists
#   vars.CWS_PUBLISH_TYPE               DEFAULT_PUBLISH (default) or STAGED_PUBLISH
#   EDGE_CLIENT_ID, EDGE_API_KEY        Partner Center Publish API (Add-ons API v1.1)
#   vars.EDGE_PRODUCT_ID                Edge product ID; the item already exists
#   vars.EDGE_PUBLISH                   'true' enables the Edge lane

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Existing tag to verify, build, and attach (the release-please path)
        required: true
        type: string
      build_draft:
        description: Run the draft job only (build the tag, attach to its release); the release-please caller sets this
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.2.0
        required: true
        type: string
      build_draft:
        description: Replay only the draft phase for the tag (attach artifacts to its release); no publish lane runs
        required: false
        default: false
        type: boolean
      dry_run:
        description: Build and validate without uploading anything (release assets, npm, or stores)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One release at a time, and never cancelled: a half-finished publish has to
# be resumed, not raced.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: build and draft
    # Only the release-please workflow reaches this job, through its
    # workflow_call after release-please tagged and drafted the release.
    # github.event_name inside a called workflow is the CALLER's event (push
    # here), never 'workflow_call' - an event_name gate can never match - so
    # the gate is the explicit build_draft input. The same input lets a
    # workflow_dispatch replay the draft phase alone when its build was
    # skipped or failed; every publish lane stays off.
    if: inputs.build_draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # contents: write is only for attaching to the draft release. Every
      # lane that does not attach assets stays at contents: read.
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the ancestor gate reads the log.
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: The tag must name the package version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/plugin/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not name packages/plugin version $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: The tag must already be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_sha="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::$TAG is not an ancestor of main; tag the merged commit"
            exit 1
          fi

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      - name: Build, package, and attach the draft release
        uses: ./.github/actions/build-release-artifacts
        with:
          version: ${{ steps.version.outputs.value }}
          tag: ${{ env.TAG }}

  # Detect once, before any lane runs: which stores have credentials, and is
  # this a dry run. Secrets may not appear in `if:` expressions (§4.8), so
  # they are reduced to booleans here; this step prints only presence, never
  # a value. This is the only job the lanes' `if:` conditions read. It runs
  # for a release or an explicit dispatch tag, so a failed upload can be
  # replayed without burning a new tag.
  channels:
    name: detect store channels
    if: >-
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      inputs.build_draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: release
    outputs:
      amo: ${{ steps.detect.outputs.amo }}
      cws: ${{ steps.detect.outputs.cws }}
      edge: ${{ steps.detect.outputs.edge }}
      dry_run: ${{ steps.detect.outputs.dry_run }}
    steps:
      - name: Reduce credentials and dry_run to booleans
        id: detect
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "${AMO_JWT_ISSUER:-}" ] && [ -n "${AMO_JWT_SECRET:-}" ]; then amo=true; else amo=false; fi
          if [ -n "${CWS_CLIENT_ID:-}" ] && [ -n "${CWS_CLIENT_SECRET:-}" ] && [ -n "${CWS_REFRESH_TOKEN:-}" ] && [ -n "${CWS_PUBLISHER_ID:-}" ] && [ -n "${CWS_ITEM_ID:-}" ]; then cws=true; else cws=false; fi
          if [ -n "${EDGE_CLIENT_ID:-}" ] && [ -n "${EDGE_API_KEY:-}" ] && [ -n "${EDGE_PRODUCT_ID:-}" ]; then edge=true; else edge=false; fi
          {
            echo "amo=$amo"
            echo "cws=$cws"
            echo "edge=$edge"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "store channels: AMO=$amo CWS=$cws Edge=$edge dry_run=$DRY_RUN"

  # The shared pre-flight every lane trusts (§4.7): a published release (a
  # dry run may validate a draft), the tag gates, the CI gate on the tag, and
  # the release's zips verified against checksums.txt. The verification runs
  # inline on purpose: a job-local `uses: ./...` action is read from the tree
  # the job has checked out - here the tag, frozen at cut time - so a fix on
  # main could never reach an already-cut tag. The v1.0.0 publish died
  # exactly there (the tag carried a broken pattern split). This file always
  # comes from the run's ref.
  verify:
    name: verify the released artifacts
    if: >-
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      inputs.build_draft != true
    needs: channels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      firefox_version: ${{ steps.artifacts.outputs.firefox_version }}
      chromium_version: ${{ steps.artifacts.outputs.chromium_version }}
      addon_id: ${{ steps.artifacts.outputs.addon_id }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      - name: Require a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ needs.channels.outputs.dry_run }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json isDraft,tagName > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo "::error::no GitHub Release exists for $TAG. Publish the draft release first; a store submission must never happen before the human gate (§4.3)."
            exit 1
          fi
          if [ "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" != "false" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::release $TAG is still a draft. A dry run uploads nothing, so validating it is safe; the real submissions require the published release."
            else
              echo "::error::release $TAG is still a draft. Publishing the release is the human gate (§4.3); publish it, then rerun this workflow with the same tag."
              exit 1
            fi
          fi
          jq -r '.tagName + " exists (draft=" + (.isDraft | tostring) + ")"' "$RUNNER_TEMP/release.json"

      # Deliberately the same gate the npm lane and the draft job run: the tag
      # names the plugin version, vX.Y.Z only, and D16 keeps prereleases off
      # every registry and store.
      - name: Read the version and refuse a non-release tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a vX.Y.Z tag; refusing to publish it"
            exit 1
          fi
          version="$(node -p "require('./packages/plugin/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not name packages/plugin version $version"
            exit 1
          fi
          # D16: prereleases never reach a registry or a store. They are GitHub
          # pre-releases that testers install themselves.
          case "$version" in
            *-*)
              echo "::error::dsh-marker@$version is a prerelease (D16); tag the final version instead"
              exit 1
              ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Pre-flight (§4.7): the same cheap gate CI runs, before anything is
      # uploaded or submitted. The workspace is the tag's tree (§4.10).
      - name: Check generated protocol copies
        shell: bash
        run: node scripts/check-sync.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: node scripts/check-syntax.mjs

      - name: Run unit tests
        shell: bash
        run: node --test "packages/*/test/*.test.js"

      - name: Check the icons match their geometry
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/build-icons.mjs ]; then
            echo "::error::scripts/build-icons.mjs is missing from this tag; the icons in the store artifact cannot be verified"
            exit 1
          fi
          node scripts/build-icons.mjs --check

      # Phase 1 built the zips and attached them to the release. The lanes
      # download and submit these exact bytes; nothing ever rebuilds them
      # (§4.9). read assigns the remainder of the line, separators included,
      # to its last variable, so the list must be split with read -a before it
      # becomes --pattern flags (the v1.0.0 tag shipped the unsplit form).
      - name: Download the released store artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PATTERNS: '*.zip,checksums.txt'
        run: |
          set -euo pipefail
          assets="$GITHUB_WORKSPACE/dist/release-assets"
          rm -rf "$assets"
          mkdir -p "$assets"

          args=()
          IFS=',' read -r -a patterns <<< "$PATTERNS"
          for pattern in "${patterns[@]}"; do
            [ -n "$pattern" ] && args+=(--pattern "$pattern")
          done
          gh release download "$TAG" --dir "$assets" "${args[@]}" --clobber

          cd "$assets"
          if [ ! -f checksums.txt ]; then
            echo "::error::checksums.txt was not among the downloaded assets for $TAG"
            exit 1
          fi
          # Only the lines for files that are actually here are checked, but a
          # downloaded artifact that checksums.txt does not name at all is a
          # hard error: the point is proving these are the hashed bytes.
          verify="$RUNNER_TEMP/verify-checksums.txt"
          : > "$verify"
          for file in *; do
            [ "$file" = "checksums.txt" ] && continue
            line="$(grep -F "  $file" checksums.txt || true)"
            if [ -z "$line" ]; then
              echo "::error::checksums.txt for $TAG does not name $file; refusing to trust unchecksummed bytes"
              exit 1
            fi
            printf '%s\n' "$line" >> "$verify"
          done
          if [ ! -s "$verify" ]; then
            echo "::error::nothing to verify: no non-checksum assets matched $PATTERNS"
            exit 1
          fi
          sha256sum --check "$verify"
          ls -l "$assets"

      - name: Unzip the verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          assets="$GITHUB_WORKSPACE/dist/release-assets"
          for target in firefox chromium; do
            rm -rf "dist/$target"
            unzip -q "$assets/dsh-marker-$target-"*.zip -d "dist/$target"
            # §4.10: validate the artifact, not the source tree.
            node scripts/check-manifest.mjs "dist/$target"
          done
          ls -l "$assets"

      - name: Read the artifact versions
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          ff_version="$(node -p "String(require('./dist/firefox/manifest.json').version ?? '')")"
          cr_version="$(node -p "String(require('./dist/chromium/manifest.json').version ?? '')")"
          addon_id="$(node -p "String(require('./dist/firefox/manifest.json').browser_specific_settings?.gecko?.id ?? '')")"
          product_version="${{ steps.version.outputs.value }}"
          if [ -z "$ff_version" ] || [ -z "$cr_version" ]; then
            echo "::error::a built manifest declares no version"
            exit 1
          fi
          # D16/§4.2: a store receives finals only. Chrome accepts one to four
          # dot-separated integers and nothing else; AMO keeps a monotonic
          # sequence per add-on ID, so a prerelease number would outrank the
          # final forever.
          if ! printf '%s' "$ff_version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::dist/firefox/manifest.json version '$ff_version' is not numeric; D16 keeps prereleases off the stores"
            exit 1
          fi
          if ! printf '%s' "$cr_version" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::dist/chromium/manifest.json version '$cr_version' is not 1-4 dot-separated integers; CWS rejects it (D16/§4.2)"
            exit 1
          fi
          # §4.1: one product version. The draft warned and attached the
          # artifacts so a human could inspect them; with the release published
          # this is now a hard refusal for every lane at once — npm included —
          # because a store version cannot be withdrawn and a mismatch means
          # the bump was not atomic. Fix is always: bump everything, tag a new
          # version.
          if [ "$ff_version" != "$product_version" ] || [ "$cr_version" != "$product_version" ]; then
            echo "::error::the released artifacts carry version $ff_version/$cr_version but the release is v$product_version (§4.1). Bump packages/extension/manifest.json and packages/plugin/package.json together and tag a new version; a store version cannot be withdrawn."
            exit 1
          fi
          {
            echo "firefox_version=$ff_version"
            echo "chromium_version=$cr_version"
            echo "addon_id=$addon_id"
          } >> "$GITHUB_OUTPUT"

  npm:
    name: publish to npm
    needs: [channels, verify]
    # A dry run must upload nothing, so npm skips too. github.event.inputs
    # keeps the raw string for a dispatch, reduced once by the channels job.
    if: needs.channels.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` on purpose: the npm trusted-publisher registration
    # names release.yml with no environment (§6.1).
    permissions:
      # OIDC trusted publishing exchanges this for the npm token.
      id-token: write
    steps:
      - name: Publish the released tarball
        uses: ./.github/actions/npm-publish
        with:
          tag: ${{ needs.verify.outputs.tag }}
          version: ${{ needs.verify.outputs.version }}

  amo:
    name: submit to AMO
    needs: [channels, verify]
    if: >-
      needs.channels.outputs.dry_run != 'true' &&
      needs.channels.outputs.amo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      # Only for attaching the signed XPI and its checksum line.
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # amo-metadata.json is read from the tag being released.
          ref: ${{ needs.verify.outputs.tag }}

      # The tag's tree is where amo-metadata.json must come from, but a
      # job-local `uses: ./...` action is read from the checked-out tree,
      # frozen at cut time (the reason verify runs inline). Overlay the run
      # ref's copy of the release actions so a fix on the branch reaches an
      # already-cut tag; a release event always runs the default branch's
      # workflow file, so 'main' is its run ref.
      - name: Refresh the release actions from the run ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event_name == 'release' && 'main' || github.ref_name }}"
          git fetch --no-tags origin "$ref"
          git checkout FETCH_HEAD -- .github/actions

      - name: Submit the released Firefox zip
        uses: ./.github/actions/amo-submit
        with:
          tag: ${{ needs.verify.outputs.tag }}
          version: ${{ needs.verify.outputs.version }}
          firefox_version: ${{ needs.verify.outputs.firefox_version }}
          addon_id: ${{ needs.verify.outputs.addon_id }}

  cws:
    name: submit to CWS
    needs: [channels, verify]
    if: >-
      needs.channels.outputs.dry_run != 'true' &&
      needs.channels.outputs.cws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
      CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE || 'DEFAULT_PUBLISH' }}
    steps:
      - name: Submit the released Chromium zip
        uses: ./.github/actions/cws-submit
        with:
          tag: ${{ needs.verify.outputs.tag }}
          version: ${{ needs.verify.outputs.version }}
          chromium_version: ${{ needs.verify.outputs.chromium_version }}

  # Edge Add-ons is optional (§4.6: Edge installs CWS items) and off by
  # default: vars.EDGE_PUBLISH opts the lane in, and it also needs the
  # Partner Center credentials (secrets EDGE_CLIENT_ID, EDGE_API_KEY) and
  # the product ID (vars.EDGE_PRODUCT_ID). The Add-ons API cannot create
  # the item — the first submission was manual (docs/STORE_LISTING.md §8);
  # this lane only updates it. The zip is the release's Chromium zip, the
  # same checksummed bytes the CWS lane submits, never a rebuild.
  edge:
    name: submit to Edge
    needs: [channels, verify]
    if: >-
      needs.channels.outputs.dry_run != 'true' &&
      needs.channels.outputs.edge == 'true' &&
      vars.EDGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    steps:
      - name: Refuse a version mismatch
        env:
          CR_VERSION: ${{ needs.verify.outputs.chromium_version }}
          PRODUCT_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$CR_VERSION" != "$PRODUCT_VERSION" ]; then
            echo "::error::refusing to submit to Edge: the Chromium artifact is version $CR_VERSION but the release is v$PRODUCT_VERSION (§4.1). Bump packages/extension/manifest.json and tag a new version; a store version cannot be withdrawn."
            exit 1
          fi

      # The lanes submit the release's bytes, never a rebuild (§4.9, §4.10).
      - name: Download the released Chromium zip and prove its checksum
        uses: ./.github/actions/fetch-verified-asset
        with:
          tag: ${{ needs.verify.outputs.tag }}
          patterns: 'dsh-marker-chromium-*.zip,checksums.txt'

      # The Edge Add-ons API v1.1 (Client ID + API key headers, no OAuth):
      # upload the zip to the draft submission, then submit it for
      # certification; the action polls both operations to completion.
      # Submission means review, not live — certification takes up to 7
      # business days (docs/STORE_LISTING.md §8.9). Pinned to a major tag
      # like every other action in this file.
      - name: Submit the released Chromium zip
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2
        with:
          product-id: ${{ vars.EDGE_PRODUCT_ID }}
          zip-path: dist/release-assets/dsh-marker-chromium-${{ needs.verify.outputs.version }}.zip
          api-key: ${{ secrets.EDGE_API_KEY }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          # The point that decides the review (§8.8): the overlay is testable
          # without the DSH host, and the host dependency is disclosed.
          notes-for-certification: >-
            Testable without the host: install, open any page, press
            Alt+Shift+A, and mark text, an element, or a region. The overlay,
            markers, and screenshot capture all work standalone. The DeepSeek
            Harness host (127.0.0.1, same machine) is needed only to send a
            mark into a session, and the privacy policy discloses it.

  # §4.7: the lanes are independent; this is where any failure becomes a red
  # run, after every lane has had its turn — with parallel lanes each failure
  # is already visible on its own job, this job exists to state the verdict
  # for the whole phase and to fail the run on purpose.
  summary:
    name: release summary
    # always(): this job states the verdict after every lane has had its
    # turn, including when a lane failed or the phase itself never ran. The
    # phase gate keeps the tag-push (draft) run free of this job.
    if: >-
      always() &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      inputs.build_draft != true
    needs: [channels, verify, npm, amo, cws, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report every lane, then fail the run if any failed
        env:
          RESULT_CHANNELS: ${{ needs.channels.result }}
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_NPM: ${{ needs.npm.result }}
          RESULT_AMO: ${{ needs.amo.result }}
          RESULT_CWS: ${{ needs.cws.result }}
          RESULT_EDGE: ${{ needs.edge.result }}
          AMO_READY: ${{ needs.channels.outputs.amo }}
          CWS_READY: ${{ needs.channels.outputs.cws }}
          DRY_RUN: ${{ needs.channels.outputs.dry_run }}
        run: |
          set -euo pipefail
          echo "channels : $RESULT_CHANNELS"
          echo "verify   : $RESULT_VERIFY"
          echo "npm      : $RESULT_NPM"
          echo "amo      : $RESULT_AMO (credentials detected: $AMO_READY)"
          echo "cws      : $RESULT_CWS (credentials detected: $CWS_READY)"
          echo "edge     : $RESULT_EDGE (gated on vars.EDGE_PUBLISH)"
          failed=""
          if [ "$RESULT_CHANNELS" = "failure" ]; then failed="$failed channels"; fi
          if [ "$RESULT_VERIFY" = "failure" ]; then failed="$failed verify"; fi
          if [ "$RESULT_NPM" = "failure" ]; then failed="$failed npm"; fi
          if [ "$RESULT_AMO" = "failure" ]; then failed="$failed amo"; fi
          if [ "$RESULT_CWS" = "failure" ]; then failed="$failed cws"; fi
          if [ "$RESULT_EDGE" = "failure" ]; then failed="$failed edge"; fi
          if [ -n "$failed" ]; then
            echo "::error::lane(s) failed:$failed. The lanes are independent (§4.7); fix the cause and rerun this workflow with the same tag. Every lane skips a version that already exists upstream."
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run complete: the release's artifacts were downloaded and verified and nothing was uploaded. Detected channels: AMO=$AMO_READY CWS=$CWS_READY Edge=vars.EDGE_PUBLISH."
          else
            echo "::notice::release phase finished without a hard failure. Submitted lanes are pending their store's review, not live; skipped lanes were not submitted."
          fi
