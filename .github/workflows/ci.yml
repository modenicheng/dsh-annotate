name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          # Deliberately no `cache: pnpm`: setup-node resolves the pnpm store
          # before corepack provisions pnpm here, and its post step then fails
          # the job over a cache path that never existed. A cold install costs
          # seconds; a red check that nobody can explain costs more.

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated protocol copies
        run: node scripts/check-sync.mjs

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.mjs

      - name: Run unit tests
        run: node --test "packages/*/test/*.test.js"

      - name: Biome format and lint
        run: pnpm exec biome check .

  manifest:
    name: extension manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate the extension manifest
        run: node scripts/check-manifest.mjs

      # The PNGs are committed but generated (scripts/build-icons.mjs, D3-style
      # contract): a store listing must never carry an icon the geometry does
      # not describe.
      - name: Check the icons match their geometry
        run: node scripts/build-icons.mjs --check
