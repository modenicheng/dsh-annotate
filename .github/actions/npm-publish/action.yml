name: 'Publish to npm'
description: >
  The npm lane (docs/DISTRIBUTION.md §6.1): gate that the release is
  published, download the tarball it attached, prove it is the checksummed
  bytes, prove the version inside the tarball names the tag, publish those
  exact bytes with provenance, and prove the registry holds them. The lane
  verifies itself; there is no shared verify job, so a failure here never
  blocks another store lane.

  Authentication is OIDC trusted publishing: no NPM_TOKEN exists anywhere in
  this repository. Three details are easy to get wrong and fail as E404 on
  PUT instead of as an auth error, so they are pinned here:
    * `registry-url` is deliberately absent from setup-node. With it,
      setup-node writes an `_authToken` line into .npmrc and npm keeps using
      a credential instead of exchanging the OIDC token.
    * npm must be 11.5.1 or newer; the runner image can ship an older one.
    * package.json `repository.url` must name this repository, or the
      provenance check rejects the publish with E422.

inputs:
  tag:
    description: The release tag whose assets are being published.
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        # No registry-url on purpose: see the description above.

    - name: Require npm 11.5.1 for trusted publishing
      shell: bash
      run: |
        set -euo pipefail
        # Pinned exactly (C6): a floating range would let a future npm major
        # change trusted-publishing behaviour on a release day. Bump this
        # literal deliberately, after reading the release notes.
        npm install -g npm@11.5.1
        npm --version

    # The human gate (§4.3): publishing the release is what lets any lane
    # submit. A draft release's assets may be perfectly fine; submitting
    # them before the Publish click is what this step refuses.
    - name: Require a published release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if ! gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
          echo "::error::no GitHub Release exists for $TAG. Publish the draft release first; a store submission must never happen before the human gate (§4.3)."
          exit 1
        fi
        if [ "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" = "true" ]; then
          echo "::error::release $TAG is still a draft. Publishing the release is the human gate (§4.3)."
          exit 1
        fi

    - name: Download the released tarball and prove its checksum
      uses: ./.github/actions/fetch-verified-asset
      with:
        tag: ${{ inputs.tag }}
        # The tarball plus the checksums file; the store zips stay with the
        # store lanes.
        patterns: '*.tgz,checksums.txt'

    # The version comes from the tarball itself (§4.10: the artifact, not a
    # tree), and must name the tag being published (§4.1).
    - name: Read the version from the tarball and refuse a mismatch
      id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        tarball="$(ls dist/release-assets/*.tgz)"
        version="$(tar -xzOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).version ?? "")))')"
        if [ -z "$version" ]; then
          echo "::error::the released tarball declares no version"
          exit 1
        fi
        if [ "v$version" != "$TAG" ]; then
          echo "::error::refusing to publish to npm: the tarball is version $version but the release is $TAG (§4.1). Bump packages/plugin/package.json and tag a new version; a registry version cannot be withdrawn."
          exit 1
        fi
        echo "value=$version" >> "$GITHUB_OUTPUT"

    # npm records sha512 in dist.integrity; computing it here is what lets the
    # lane prove, after the fact, that the registry holds these exact bytes.
    - name: Record the expected integrity
      id: integrity
      shell: bash
      run: |
        set -euo pipefail
        tarball="$(ls dist/release-assets/*.tgz)"
        integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
        echo "value=$integrity" >> "$GITHUB_OUTPUT"

    # curl, not `npm view`: npm caches the packument it fetched while the
    # version did not exist yet, so every later `npm view` in the same job
    # keeps reporting the fresh version as missing. That is how 0.1.2 was
    # published successfully and then failed its own verification.
    # A rerun after a partial failure must not fail on "version exists"; it
    # must agree that the registry already holds this tarball, or stop loudly.
    - name: Skip when this version is already on the registry
      id: exists
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.value }}
        EXPECTED: ${{ steps.integrity.outputs.value }}
      run: |
        set -euo pipefail
        published="$(curl -fsS --max-time 20 "https://registry.npmjs.org/dsh-marker/$VERSION" 2>/dev/null | jq -r '.dist.integrity // empty' || true)"
        if [ -z "$published" ]; then
          echo "value=no" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$published" != "$EXPECTED" ]; then
          echo "::error::dsh-marker@$VERSION is already published with $published, but this release carries $EXPECTED"
          exit 1
        fi
        echo "::notice::dsh-marker@$VERSION is already published with these exact bytes; nothing to do"
        echo "value=yes" >> "$GITHUB_OUTPUT"

    # Publishing the tarball, not the directory, is what makes the release
    # asset and the registry entry provably the same artifact. If npm ever
    # refuses provenance for a tarball, the fallback is to publish the
    # directory and compare dist.integrity afterwards — but then the bytes
    # published are the ones npm packed, not the ones this lane hashed.
    - name: Publish with provenance
      shell: bash
      if: steps.exists.outputs.value == 'no'
      run: |
        set -euo pipefail
        npm publish ./dist/release-assets/*.tgz --provenance --access public

    # Anonymous by construction: no token is configured in this lane, so this
    # is the view a stranger gets. A fresh publish is eventually consistent
    # across replicas — v0.1.3 took over a minute to appear and failed this
    # check while the publish had actually succeeded — so the window is five
    # minutes, not one.
    - name: Verify the registry holds these bytes
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.value }}
        EXPECTED: ${{ steps.integrity.outputs.value }}
      run: |
        set -euo pipefail
        for attempt in $(seq 1 20); do
          published="$(curl -fsS --max-time 20 "https://registry.npmjs.org/dsh-marker/$VERSION" 2>/dev/null | jq -r '.dist.integrity // empty' || true)"
          if [ "$published" = "$EXPECTED" ]; then
            echo "registry holds dsh-marker@$VERSION ($EXPECTED)"
            exit 0
          fi
          echo "attempt $attempt: registry has '${published:-nothing}' yet"
          sleep 15
        done
        echo "::error::dsh-marker@$VERSION did not appear with $EXPECTED"
        exit 1
